<style>
:root{
  --charcoal:#052E2B;
  --charcoal-deep:#021412;
  --primary:#0F766E;
  --primary-soft:#5eb8ae;
  --accent:#FBBF24;
  --bg:#FAFAF5;
  --cream:#FFF6DE;
  --cream-deep:#FBE8B5;
  --text:#14211F;
  --muted:#5B6B68;
  --font-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-body:'DM Sans',system-ui,sans-serif;
  --vm:20px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{height:100%}
body{min-height:100vh;min-height:100svh;font-family:var(--font-body);font-size:1.05rem;line-height:1.65;background:var(--bg);color:var(--text);overflow-x:hidden;display:flex;align-items:center;justify-content:center;position:relative;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}

/* ===== BACKDROP ===== */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(2px)}
.blob.b1{width:520px;height:520px;left:-160px;top:-160px;background:radial-gradient(circle at 30% 30%,rgba(15,118,110,.4),rgba(15,118,110,.05))}
.blob.b2{width:440px;height:440px;right:-120px;bottom:-140px;background:radial-gradient(circle at 60% 40%,rgba(251,232,181,.95),rgba(251,232,181,.15))}
.blob.b3{width:260px;height:260px;right:14%;top:8%;background:radial-gradient(circle at 40% 40%,rgba(5,46,43,.14),rgba(5,46,43,.02))}
.dot{position:absolute;border-radius:50%;background:var(--accent);opacity:.7}
.ring{position:absolute;border-radius:50%;border:2px dashed rgba(5,46,43,.2)}

/* corner marks, fixed to screen corners */
.vf{position:fixed;width:38px;height:38px;border:2px solid var(--charcoal);opacity:.45;z-index:1;pointer-events:none}
.vf.tl{top:var(--vm);left:var(--vm);border-right:0;border-bottom:0}
.vf.tr{top:var(--vm);right:var(--vm);border-left:0;border-bottom:0}
.vf.bl{bottom:var(--vm);left:var(--vm);border-right:0;border-top:0}
.vf.br{bottom:var(--vm);right:var(--vm);border-left:0;border-top:0}

/* ===== CONTENT ===== */
.wrap{position:relative;z-index:2;width:100%;max-width:740px;padding:84px 28px;text-align:center}
.code{display:flex;align-items:center;justify-content:center;gap:clamp(6px,2vw,18px);font-family:var(--font-display);font-weight:800;line-height:1;font-size:clamp(96px,22vw,210px);letter-spacing:-.02em;margin-bottom:8px}
.code .d{display:inline-block;will-change:transform,opacity}
.code .four{background:linear-gradient(160deg,var(--charcoal),var(--primary) 70%,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .02em}
.gear{position:relative;display:inline-block;width:.8em;height:.8em;filter:drop-shadow(0 14px 18px rgba(2,20,18,.28))}
.gear svg{display:block;width:100%;height:100%}
.gear .spin{transform-origin:50% 50%;animation:roll 14s linear infinite}
.gear .hub{fill:var(--accent)}

.eyebrow{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.2em;font-size:.95rem;font-weight:600;color:var(--primary);display:inline-flex;align-items:center;gap:10px;margin-bottom:14px}
.eyebrow::before,.eyebrow::after{content:"";width:28px;height:2px;background:var(--accent);display:inline-block}
h1{font-family:var(--font-display);font-weight:800;letter-spacing:-.005em;color:var(--charcoal);font-size:clamp(2.2rem,5.6vw,3.5rem);line-height:1.05;text-transform:uppercase;margin-bottom:14px}
h1 em{font-style:normal;color:var(--primary)}
p.lead{color:var(--muted);font-size:1.1rem;line-height:1.65;max-width:520px;margin:0 auto 34px}

.actions{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:.6rem;padding:.9rem 1.8rem;border-radius:999px;font-family:var(--font-body);font-weight:700;font-size:1rem;position:relative;overflow:hidden;transition:transform .35s ease,box-shadow .35s ease,background .35s ease,color .35s ease,border-color .35s ease}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s ease}
.btn-outline{background:transparent;color:var(--charcoal);border:2px solid var(--charcoal)}
.btn-outline:hover{background:var(--charcoal);color:var(--cream);transform:translateY(-3px);box-shadow:0 12px 24px rgba(5,46,43,.25)}
.btn-outline:hover svg{transform:translateX(-4px)}
.btn-primary{background:var(--accent);color:var(--charcoal);border:2px solid var(--accent)}
.btn-primary:hover{background:var(--charcoal);border-color:var(--charcoal);color:var(--cream);transform:translateY(-3px);box-shadow:0 12px 24px rgba(5,46,43,.3)}
.btn-primary:hover svg{transform:scale(1.15)}
.btn:active{transform:translateY(-1px) scale(.98)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* ===== PAGE TRANSITION CURTAIN ===== */
.curtain{position:fixed;inset:0;z-index:50;background:var(--charcoal);transform:translateY(100%);pointer-events:none;border-radius:50% 50% 0 0 / 12% 12% 0 0}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes roll{to{transform:rotate(360deg)}}

/* No-GSAP fallback */
.no-gsap .anim{animation:fadeUp .8s ease both}
.no-gsap .anim:nth-child(2){animation-delay:.15s}
.no-gsap .anim:nth-child(3){animation-delay:.3s}
.no-gsap .anim:nth-child(4){animation-delay:.45s}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  .gear .spin{animation:none}
}
@media (max-width:480px){
  :root{--vm:12px}
  .vf{width:26px;height:26px}
  .wrap{padding:72px 24px}
  .btn{width:100%;justify-content:center}
  .actions{flex-direction:column}
}

/* PRELOADER */
html.pl-lock,html.pl-lock body{overflow:hidden}
.preloader{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--charcoal,#052E2B);transition:opacity .45s ease,visibility .45s ease}
.preloader.pl-hide{opacity:0;visibility:hidden}
.pl-gear{width:56px;height:56px;color:var(--accent,#FBBF24)}
.pl-spin{transform-box:fill-box;transform-origin:center;animation:pl-spin 1s linear infinite}
.pl-spin path{fill:currentColor;fill-rule:evenodd}
.pl-spanner{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pl-logo{width:clamp(130px,22vw,180px);height:auto;background:transparent}
@keyframes pl-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.pl-spin{animation-duration:3s}}
</style>
</head>

<script>
(function(){
  var curtain = document.getElementById('curtain');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* page-leave transition, then navigate */
  function leave(go){
    if(reduce || typeof gsap === 'undefined'){ go(); return; }
    gsap.fromTo(curtain, {yPercent:100}, {yPercent:0, duration:.6, ease:'power3.inOut', onComplete:go});
  }
  document.getElementById('goBack').addEventListener('click', function(){
    leave(function(){
      if(window.history.length > 1){ window.history.back(); }
      else { window.location.href = 'index.html'; }
    });
  });
  document.getElementById('goHome').addEventListener('click', function(e){
    e.preventDefault();
    var href = this.getAttribute('href');
    leave(function(){ window.location.href = href; });
  });
  /* back/forward cache: reset the curtain */
  window.addEventListener('pageshow', function(ev){
    if(ev.persisted && typeof gsap !== 'undefined'){ gsap.set(curtain, {yPercent:100}); }
  });

  /* entrance animation */
  if(typeof gsap === 'undefined'){
    document.documentElement.classList.add('no-gsap');
    return;
  }
  gsap.set(curtain, {yPercent:100});
  if(reduce) return;

  var fours = document.querySelectorAll('.d.four');
  var orb = document.getElementById('orb');
  var tl = gsap.timeline({defaults:{ease:'power3.out'}});
  tl.from(fours[0], {x:-120, opacity:0, rotate:-14, duration:1})
    .from(fours[1], {x:120, opacity:0, rotate:14, duration:1}, '<')
    .from(orb, {scale:0, opacity:0, rotate:-180, duration:1.1, ease:'back.out(1.7)'}, '-=.7')
    .from('.eyebrow', {y:20, opacity:0, duration:.6}, '-=.4')
    .from('h1', {y:30, opacity:0, duration:.7}, '-=.35')
    .from('.lead', {y:24, opacity:0, duration:.7}, '-=.5')
    .from('.actions .btn', {y:28, opacity:0, scale:.92, duration:.6, stagger:.14, ease:'back.out(1.6)'}, '-=.45')
    .from('.vf', {opacity:0, scale:1.6, duration:.9, stagger:.08}, 0.2);

  /* ambient motion */
  gsap.to('.blob.b1', {x:60, y:40, duration:9, repeat:-1, yoyo:true, ease:'sine.inOut'});
  gsap.to('.blob.b2', {x:-50, y:-40, duration:11, repeat:-1, yoyo:true, ease:'sine.inOut'});
  gsap.to('.blob.b3', {x:-30, y:50, duration:8, repeat:-1, yoyo:true, ease:'sine.inOut'});
  gsap.utils.toArray('.dot').forEach(function(d,i){
    gsap.to(d, {y:'+='+gsap.utils.random(-30,30), x:'+='+gsap.utils.random(-20,20), duration:gsap.utils.random(3,6), repeat:-1, yoyo:true, ease:'sine.inOut', delay:i*.2});
  });
  gsap.to('.ring', {rotate:360, duration:40, repeat:-1, ease:'none'});
  gsap.to(orb, {y:-12, duration:2.4, repeat:-1, yoyo:true, ease:'sine.inOut', delay:1.6});

  /* subtle mouse parallax */
  var code = document.querySelector('.code');
  window.addEventListener('mousemove', function(e){
    var x = (e.clientX / window.innerWidth - .5), y = (e.clientY / window.innerHeight - .5);
    gsap.to(code, {x:x*18, y:y*12, duration:.8, ease:'power2.out', overwrite:'auto'});
    gsap.to('.bg', {x:-x*20, y:-y*14, duration:1.2, ease:'power2.out', overwrite:'auto'});
  });
})();
</script>
<script>
/* PRELOADER logic: gear + logo, shown for 1 second */
(function(){
  var pre=document.getElementById('preloader');
  if(!pre)return;
  try{if(window.gsap){gsap.globalTimeline.pause();window.__plResume=function(){try{gsap.globalTimeline.resume()}catch(e){}}}}catch(e){}
  var start=performance.now(),done=false;
  function hide(){
    if(done)return;done=true;
    pre.classList.add('pl-hide');
    document.documentElement.classList.remove('pl-lock');
    if(window.__plResume)window.__plResume();
    setTimeout(function(){if(pre.parentNode)pre.parentNode.removeChild(pre);},500);
  }
  function ready(){setTimeout(hide,Math.max(0,1000-(performance.now()-start)));}
  if(document.readyState==='complete')ready();else window.addEventListener('load',ready);
  setTimeout(hide,4000);
})();
</script>
